[gcode_macro PREHEAT]
description: Start interruptible preheat with material presets
gcode: !!include python/chamber_heating.py

[gcode_macro COOLDOWN_SEQUENCE]
description: Cooldown with or without chamber wait. QUICK=1 skips the controlled stepped cooldown, QUICK=0 allows it for warp-prone materials
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set vars = printer["gcode_macro _PRINTER_VARS"] %}
    {% set material = svv.current_material | string|upper  %}
    {% set warp_materials = vars.warp_prone_materials|string|upper %}
    {% set chamber_target_temp = params.TARGET_CHAMBER_TEMP|default(35)|float %}
    {% set bed_temp = printer.heater_bed.temperature %}
    {% set filter_delayed_stop_duration = vars.filter_stop_delay|int %}

    {% set needs_controlled_cooldown = True if material in warp_materials else False %}
    {% set quick = params.QUICK|default(0)|int %}
    RESPOND MSG="Starting Cooldown sequence!"
    M104 S0   ; hotend off immediately - controlled branch only reaches TURN_OFF_HEATERS after the stepped bed cooldown

      {% if not needs_controlled_cooldown or quick == 1 %}
        {% if not needs_controlled_cooldown %}
            RESPOND MSG="Material '{material}' doesn't warp - skipping controlled cooldown"
        {% else %}
            RESPOND MSG="Quick cooldown selected - skipping controlled cooldown"
        {% endif %}

        TURN_OFF_HEATERS

        TURN_PART_COOLING_FAN_OFF
        CHAMBER_HEATING_FANS_OFF
        {% if vars.filter_fan != "" %}
            RESPOND MSG="Running filtration for {(filter_delayed_stop_duration / 60)|int} minutes..."
            UPDATE_DELAYED_GCODE ID=FILTER_DELAYED_STOP DURATION={filter_delayed_stop_duration}
        {% endif %}

        RESPOND MSG="Quick cooldown complete for {material}"

    {% else %}
        RESPOND MSG="Controlled cooldown for {material} — bed: {bed_temp|int}C"

        TURN_PART_COOLING_FAN_OFF
        CHAMBER_FANS_ON

        {% if bed_temp > vars.cooldown_min_bed_temp|float %}
            {% set cooldown_steps = [(bed_temp * vars.cooldown_step_fraction|float)|int, vars.cooldown_final_temp|int] %}

            {% set ns = namespace(last_temp = bed_temp|int) %}
            {% for temp in cooldown_steps %}
                {% if temp < ns.last_temp %}
                    RESPOND MSG="Bed → {temp}C..."
                    M190 S{temp}
                    G4 P{(vars.cooldown_step_dwell|int) * 1000}
                    {% set ns.last_temp = temp %}
                {% endif %}
            {% endfor %}

            M140 S0
        {% endif %}

        RESPOND MSG="Bed cooldown complete. Filter running {(filter_delayed_stop_duration / 60)|int} more minutes."
        TURN_PART_COOLING_FAN_OFF
        CHAMBER_HEATING_FANS_OFF
        {% if vars.filter_fan != "" %}
            UPDATE_DELAYED_GCODE ID=FILTER_DELAYED_STOP DURATION={filter_delayed_stop_duration}
        {% endif %}
        TURN_OFF_HEATERS

        RESPOND MSG="Controlled cooldown complete for {material}!"
    {% endif %}
